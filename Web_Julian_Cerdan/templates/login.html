<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Julián Cerdán</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/escudo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--color-negro);
            /* Fondo inmersivo sutil */
            background-image: radial-gradient(circle at center, rgba(212, 175, 55, 0.05) 0%, rgba(5, 5, 5, 1) 70%);
        }

        .login-card {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 50px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card img.logo {
            width: 90px;
            height: auto;
            margin-bottom: 20px;
        }

        .login-card h2 {
            color: var(--color-oro);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .login-card p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        /* Botón de Google Auténtico */
        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            background-color: #ffffff;
            color: #3c4043;
            border: 1px solid #dadce0;
            padding: 14px 20px;
            border-radius: 8px;
            font-family: 'Roboto', 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-google:hover {
            background-color: #f8f9fa;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .btn-google img {
            width: 20px;
            height: 20px;
        }

        .btn-volver {
            display: inline-block;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.75rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-volver:hover {
            color: var(--color-oro);
        }

        #login-status {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #ff3b3b;
            font-weight: 700;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="../img/escudo.png" alt="Escudo Julián Cerdán" class="logo">
        <h2>Entra en nuestra comunidad</h2>
        <p>Si quieres interactuar, comentar y seguirnos más de cerca ¡Síguenos|</p>
        
        <button id="btn-auth-google" class="btn-google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
            Continuar con Google
        </button>

        <div id="login-status"></div>

        <a href="../index.html" class="btn-volver">← Volver al Inicio</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    
<script>
        /* =========================================
           LÓGICA DE AUTENTICACIÓN OAUTH (GOOGLE)
        ========================================= */
        const btnGoogle = document.getElementById('btn-auth-google');
        const statusDiv = document.getElementById('login-status');

        btnGoogle.addEventListener('click', async () => {
            try {
                statusDiv.style.color = "var(--color-oro)";
                statusDiv.innerText = "Conectando con servidores de autenticación...";
                
                // 1. CORRECCIÓN: Redirigimos al INDEX (raíz), no al admin
                const urlRedireccion = window.location.origin + '/index.html';

                const { data, error } = await clienteSupabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: urlRedireccion
                    }
                });

                if (error) throw error;

            } catch (error) {
                console.error("Fallo de seguridad:", error.message);
                statusDiv.style.color = "#ff3b3b";
                statusDiv.innerText = "Error en la validación de credenciales.";
            }
        });

        // Verificación de sesión activa (por si el usuario recarga la página de login)
        async function comprobarSesion() {
            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (session) {
                statusDiv.style.color = "#27ae60"; // Verde
                statusDiv.innerText = "Sesión detectada. Redirigiendo al Hub Principal...";
                setTimeout(() => {
                    // 2. CORRECCIÓN: Si ya hay sesión, vuelve al index
                    window.location.href = '../index.html';
                }, 1000);
            }
        }

        window.onload = comprobarSesion;
    </script>

</body>
</html>
