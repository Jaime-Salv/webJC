<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Sin conexión - Julián Cerdán</title>
    <link rel="icon" href="img/escudo.png">
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 22px;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        main {
            width: min(100%, 480px);
            padding: 30px 22px;
            border: 1px solid rgba(212,175,55,0.4);
            border-radius: 15px;
            background: #111;
        }
        img { width: 84px; }
        h1 { color: #d4af37; font-size: 1.5rem; }
        p { color: #aaa; line-height: 1.6; }
        button {
            min-height: 46px;
            padding: 0 20px;
            border: 0;
            border-radius: 999px;
            background: #d4af37;
            color: #000;
            font-weight: 900;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="img/escudo.png" alt="Banda de Música Julián Cerdán">
        <h1>Ahora mismo no hay conexión</h1>
        <p>Algunas páginas guardadas siguen disponibles. Cuando vuelva la cobertura podrás actualizar directos y contenidos.</p>
        <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
</body>
</html>
