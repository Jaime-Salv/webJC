<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Directo - Julián Cerdán</title>

    <link rel="icon" type="image/png" href="../img/escudo.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        :root {
            --color-oro: #d4af37;
            --color-negro: #050505;
            --border-gold: rgba(212, 175, 55, 0.4);
        }

        html,
        body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
            background-color: var(--color-negro);
            color: white;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        body {
            background-image:
                linear-gradient(to bottom, rgba(10,10,10,0.7) 0%, rgba(5,5,5,0.98) 100%),
                url('../img/foto-dashboard.jpg');
            background-size: cover;
            background-position: center 30%;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding-top: 100px;
        }

        .main-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 1000;
        }

        .logo-side img {
            height: 45px;
            width: auto;
        }

        .header-center h2 {
            font-size: 1rem;
            text-transform: uppercase;
            margin: 0;
            color: var(--color-oro);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: center;
        }

        .badge-live {
            background: #ff3b3b;
            color: white;
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            animation: parpadeo 2s infinite;
            white-space: nowrap;
        }

        @keyframes parpadeo {
            0% { opacity: 1; }
            50% { opacity: 0.45; }
            100% { opacity: 1; }
        }

        .contenedor-seguimiento-live {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px 40px 15px;
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            align-items: start;
        }

        .columna-chat {
            position: sticky;
            top: 100px;
        }

        #panel-chat-directo {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 20px;
        }

        #panel-chat-directo h3 {
            color: var(--color-oro);
            margin-top: 0;
            font-size: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        #caja-mensajes {
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding-right: 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--color-oro) transparent;
        }

        .mensaje-chat {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .controles-chat {
            display: flex;
            gap: 10px;
        }

        .controles-chat input {
            flex: 1;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            min-width: 0;
        }

        .controles-chat button {
            background: var(--color-oro);
            color: black;
            border: none;
            padding: 0 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .controles-chat button:hover {
            opacity: 0.85;
        }

        .columna-timeline {
            background: rgba(18, 18, 18, 0.7);
            border-radius: 8px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .live-resumen {
            display: grid;
            grid-template-columns: minmax(0, 2fr) repeat(2, minmax(85px, 1fr));
            gap: 9px;
            margin-bottom: 10px;
        }

        .live-resumen-item {
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid rgba(212, 175, 55, 0.18);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.035);
        }

        .live-resumen-item span {
            display: block;
            margin-bottom: 4px;
            color: #888;
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .live-resumen-item strong {
            display: block;
            overflow: hidden;
            color: white;
            font-size: 0.75rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #live-conexion { color: #62d98c; }
        #live-conexion.offline { color: #ffba59; }

        #live-actualizado {
            margin: 0 0 14px;
            color: #777;
            font-size: 0.62rem;
        }

        #live-actualizado.cache { color: #ffba59; }

        #timeline-contenedor {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .marcha-live-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 6px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
        }

        .marcha-live-card.ultima {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--color-oro);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
            transform: scale(1.02);
            margin-bottom: 8px;
        }

        .ml-info {
            flex: 1;
            min-width: 0;
        }

        .ml-fase {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 4px;
        }

        .ultima .ml-fase {
            color: var(--color-oro);
            font-weight: bold;
        }

        .ml-titulo {
            margin: 0;
            font-size: 0.95rem;
            color: white;
            font-weight: 700;
        }

        .ml-orden {
            font-size: 0.8rem;
            font-weight: 900;
            color: rgba(212, 175, 55, 0.5);
            margin-left: 15px;
            white-space: nowrap;
        }

        .estado-vacio {
            color: #777;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        @media (max-width: 900px) {
            body {
                padding-top: 90px;
            }

            .contenedor-seguimiento-live {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .columna-chat {
                position: static;
                order: 2;
            }

            .columna-timeline {
                order: 1;
            }

            #caja-mensajes {
                height: 300px;
            }

            .header-center h2 {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 520px) {
            .main-header {
                padding: 0 12px;
            }

            .logo-side img {
                height: 38px;
            }

            .header-center h2 {
                flex-direction: column;
                gap: 4px;
            }

            .contenedor-seguimiento-live {
                padding: 0 10px 30px 10px;
            }

            .controles-chat {
                flex-direction: column;
            }

            .controles-chat button {
                padding: 12px;
            }

            .marcha-live-card {
                align-items: flex-start;
            }

            .live-resumen {
                grid-template-columns: 1fr 1fr;
            }

            .live-resumen-item:first-child {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="logo-side">
            <a href="../index.html">
                <img src="../img/escudo.png" alt="Escudo">
            </a>
        </div>

        <div class="header-center">
            <h1>
                <span id="txt-hermandad-header">Cargando...</span>
                <span class="badge-live">EN VIVO</span>
            </h1>
        </div>

        <div style="width: 45px;"></div>
    </header>

    <main class="contenedor-seguimiento-live">

        <aside class="columna-chat">
            <div id="panel-chat-directo">
                <h3>Comunidad en Vivo</h3>

                <div id="caja-mensajes">
                    <p class="estado-vacio">Conectando con el chat...</p>
                </div>

                <div class="controles-chat">
                    <input type="text" id="input-chat" placeholder="Comenta la cruceta...">
                    <button id="btn-enviar-chat" type="button">Enviar</button>
                </div>
            </div>
        </aside>

        <article class="columna-timeline">
            <h3 style="color: var(--color-oro); border-bottom: 1px solid rgba(212, 175, 55, 0.2); padding-bottom: 15px; margin-top:0;">
                Secuencia Musical
            </h3>

            <div class="live-resumen" aria-label="Resumen del directo">
                <div class="live-resumen-item">
                    <span>Ahora</span>
                    <strong id="live-ahora">Esperando</strong>
                </div>
                <div class="live-resumen-item">
                    <span>Interpretadas</span>
                    <strong id="live-total">0</strong>
                </div>
                <div class="live-resumen-item">
                    <span>Conexión</span>
                    <strong id="live-conexion">Comprobando</strong>
                </div>
            </div>
            <p id="live-actualizado">Conectando con el directo…</p>

            <div id="timeline-contenedor">
                <p class="estado-vacio">Esperando a que la dirección musical inyecte la primera marcha...</p>
            </div>
        </article>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/consent.js"></script>
<script src="../js/analytics.js"></script>
<script src="../js/pwa.js"></script>
<script src="../js/config.js"></script>
<script src="../js/live.js"></script>
</body>
</html>
