<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transmisión en Directo - Julián Cerdán</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/escudo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        html, body { 
            max-width: 100vw; 
            overflow-x: hidden; 
            margin: 0; 
            padding: 0; 
            background-color: #050505; 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
        }

        body { padding-top: 100px; }
        :root { --color-oro: #d4af37; --color-negro: #050505; }

        /* HEADER UNIFICADO (Jaime Rubiales) */
        .main-header-pro { 
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; background: rgba(5, 5, 5, 0.95); 
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(212, 175, 55, 0.3); 
            z-index: 1000; 
        }
        .header-logo-side img { height: 45px; width: auto; }
        .header-title-side h2 { font-size: 0.8rem; text-transform: uppercase; text-align: center; margin: 0; letter-spacing: 1px; color: var(--color-oro); }
        .btn-volver-pro { 
            border: 1px solid var(--color-oro); color: var(--color-oro); 
            padding: 8px 12px; border-radius: 4px; font-weight: 700; 
            font-size: 0.65rem; text-transform: uppercase; text-decoration: none; 
            transition: 0.3s;
        }
        .btn-volver-pro:hover { background: var(--color-oro); color: black; }

        .global-container { width: 100%; max-width: 900px; margin: 0 auto; padding: 20px 15px 80px 15px; }

        /* Cabecera Live */
        .hero-live {
            position: relative; padding: 40px; border-radius: 12px; margin-bottom: 40px;
            background-size: cover; background-position: center; border: 1px solid rgba(255, 59, 59, 0.4);
            overflow: hidden; box-shadow: 0 10px 40px rgba(255, 59, 59, 0.1);
        }
        .hero-overlay-live {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, rgba(5,5,5,0.95) 20%, rgba(5,5,5,0.8) 100%); z-index: 1;
        }
        .hero-content { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; }
        
        .indicador-directo {
            background: rgba(255, 59, 59, 0.15); color: #ff3b3b; padding: 8px 15px;
            border-radius: 50px; font-size: 0.8rem; font-weight: 900; letter-spacing: 2px;
            text-transform: uppercase; display: flex; align-items: center; gap: 10px;
            border: 1px solid rgba(255, 59, 59, 0.3);
            width: fit-content;
        }
        .punto-rojo {
            width: 10px; height: 10px; background-color: #ff3b3b; border-radius: 50%;
            animation: latido 1.5s infinite;
        }
        @keyframes latido {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(255, 59, 59, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 59, 0); }
        }

        .hero-live h1 { font-size: 2rem; color: white; margin: 15px 0 5px 0; text-transform: uppercase; font-weight: 900; line-height: 1.1; }
        .hero-live p { color: #ccc; font-size: 1rem; letter-spacing: 1px; margin: 0; }

        /* Timeline del Directo */
        .timeline-live { margin-top: 40px; }
        
        .marcha-live-card {
            background: rgba(18, 18, 18, 0.8); border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 25px; border-radius: 8px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 4px solid var(--color-oro);
            animation: aparecer 0.5s ease-out;
        }
        @keyframes aparecer { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

        .marcha-live-card.ultima { border-left-color: #ff3b3b; background: rgba(255, 59, 59, 0.05); }

        .ml-fase { color: var(--color-oro); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .ml-titulo { color: white; font-size: 1.5rem; font-weight: 900; margin: 5px 0; }
        .ml-autor { color: #888; font-size: 0.9rem; margin: 0; }
        .ml-orden { font-size: 2.5rem; font-weight: 900; color: rgba(255,255,255,0.05); }

        @media (min-width: 1024px) {
            .main-header-pro { padding: 0 50px; height: 100px; }
            body { padding-top: 120px; }
            .hero-live h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header class="main-header-pro">
        <div class="header-logo-side"><a href="../index.html"><img src="../img/escudo.png" alt="Escudo"></a></div>
        <div class="header-title-side"><h2>Transmisión Live</h2></div>
        <div class="header-action-side"><a href="../index.html" class="btn-volver-pro">Volver al Hub</a></div>
    </header>

    <main class="global-container">
        
        <section id="hero-live" class="hero-live">
            <div class="hero-overlay-live"></div>
            <div class="hero-content">
                <div>
                    <div class="indicador-directo"><div class="punto-rojo"></div> EN DIRECTO</div>
                    <h1 id="titulo-hermandad">Conectando con la cruz de guía...</h1>
                    <p id="subtitulo-localidad">Sincronizando telemetría...</p>
                </div>
                <div style="text-align: right;">
                    <span style="display:block; color:#aaa; font-size:0.6rem; text-transform:uppercase; letter-spacing: 1px;">Marchas Tocadas</span>
                    <strong id="contador-marchas" style="color:white; font-size:3rem; font-weight:900;">0</strong>
                </div>
            </div>
        </section>

        <div id="timeline-directo" class="timeline-live">
            </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/live.js"></script>

</body>
</html>
