<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Julián Cerdán</title>
    
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/escudo.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
    <meta name="theme-color" content="#050505">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { 
            max-width: 100vw; overflow-x: hidden; margin: 0; padding: 0; 
            background-color: #050505; color: white; font-family: 'Montserrat', sans-serif; 
        }
        body { padding-top: 100px; }
        :root { --color-oro: #d4af37; --color-negro: #050505; }

        /* HEADER UNIFICADO */
        .main-header-pro { 
            position: fixed; top: 0; left: 0; width: 100%; height: 80px; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; background: rgba(5, 5, 5, 0.95); 
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(212, 175, 55, 0.3); 
            z-index: 1000; 
        }
        .header-logo-side img { height: 45px; width: auto; }
        .header-title-side h2 { 
            font-size: 0.8rem; text-transform: uppercase; text-align: center; 
            margin: 0; letter-spacing: 1px; color: var(--color-oro); 
        }
        .btn-volver-pro { 
            border: 1px solid var(--color-oro); color: var(--color-oro); 
            padding: 8px 12px; border-radius: 4px; font-weight: 700; 
            font-size: 0.65rem; text-transform: uppercase; text-decoration: none; 
        }

        /* CONTENEDOR DE PERFIL */
        .global-container { width: 100%; max-width: 700px; margin: 0 auto; padding: 20px 15px 80px 15px; }
        
        .card-sim { 
            background: rgba(18, 18, 18, 0.9); border: 1px solid #222; 
            padding: 40px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
        }
        .card-sim h3 { 
            color: var(--color-oro); margin: 0 0 30px 0; font-size: 1.2rem; 
            text-transform: uppercase; letter-spacing: 2px; text-align: center;
            border-bottom: 1px solid #222; padding-bottom: 15px; font-weight: 900;
        }

        /* AVATAR EDITOR */
        .avatar-edit-zone { text-align: center; margin-bottom: 35px; position: relative; }
        .avatar-preview-lg { 
            width: 140px; height: 140px; border-radius: 50%; 
            border: 3px solid var(--color-oro); object-fit: cover; 
            background: #000; margin-bottom: 15px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        /* FORMULARIO */
        .input-group { margin-bottom: 25px; }
        .input-group label { 
            display: block; font-size: 0.65rem; color: #666; 
            text-transform: uppercase; margin-bottom: 8px; font-weight: 700; letter-spacing: 1px;
        }
        .input-sim { 
            width: 100%; padding: 15px; background: #0a0a0a; border: 1px solid #222; 
            color: white; border-radius: 8px; font-family: 'Montserrat'; font-size: 0.95rem; 
        }
        .input-sim:focus { outline: none; border-color: var(--color-oro); }
        textarea.input-sim { min-height: 120px; resize: vertical; line-height: 1.5; }
        .preferencias-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
        .opcion-preferencia { display:flex; align-items:center; gap:9px; min-height:48px; padding:10px 12px; border:1px solid #262626; border-radius:8px; background:#0a0a0a; color:#bbb; font-size:.7rem; cursor:pointer; }
        .opcion-preferencia input { accent-color:var(--color-oro); width:18px; height:18px; }
        .seccion-preferencias { margin:30px 0; padding-top:25px; border-top:1px solid #222; }
        .seccion-preferencias h4 { color:var(--color-oro); margin:0 0 8px; font-size:.82rem; text-transform:uppercase; }
        .seccion-preferencias p { color:#777; font-size:.68rem; line-height:1.5; margin:0 0 14px; }

        .btn-accion { 
            width: 100%; background: var(--color-oro); color: black; 
            font-weight: 900; padding: 18px; border: none; border-radius: 8px; 
            text-transform: uppercase; cursor: pointer; transition: 0.3s; 
            letter-spacing: 1px; font-size: 0.8rem;
        }
        .btn-accion:hover { background: white; transform: translateY(-2px); }

        @media (min-width: 1024px) {
            .main-header-pro { padding: 0 50px; height: 100px; }
            body { padding-top: 120px; }
        }

        @media (max-width: 600px) {
            body { padding-top: 86px; }
            .main-header-pro { height: 72px; padding: 0 10px; }
            .header-logo-side img { height: 40px; }
            .header-title-side h2 { font-size: 0.66rem; }
            .btn-volver-pro { padding: 8px 9px; font-size: 0.56rem; }
            .global-container { padding: 12px 10px 60px; }
            .card-sim { padding: 22px 16px; border-radius: 12px; }
            .card-sim h3 { font-size: 0.95rem; letter-spacing: 1px; }
            .avatar-preview-lg { width: 112px; height: 112px; }
            .preferencias-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>

    <header class="main-header-pro">
        <div class="header-logo-side"><a href="../index.html"><img src="../img/escudo.png" alt="Escudo"></a></div>
        <div class="header-title-side"><h2>Mi Identidad Musical</h2></div>
        <div class="header-action-side"><a href="comunidad.html" class="btn-volver-pro">Volver</a></div>
    </header>

    <main class="global-container">
        <div class="card-sim">
            <h3>Editar Perfil</h3>
            
            <div class="avatar-edit-zone">
                <img id="avatar-preview" src="../img/escudo.png" class="avatar-preview-lg" alt="Previsualización">
                <input type="file" id="input-avatar" accept="image/*" style="display: none;">
                <button onclick="document.getElementById('input-avatar').click()" class="btn-accion" style="width: auto; padding: 10px 20px; font-size: 0.65rem; margin: 0 auto; display: block;">Cambiar Fotografía</button>
            </div>

            <div class="input-group">
                <label>Nombre Público / Apodo</label>
                <input type="text" id="perf-nombre" class="input-sim" placeholder="Tu nombre en la comunidad...">
            </div>

            <div class="input-group">
                <label>Sobre mí (Biografía)</label>
                <textarea id="perf-bio" class="input-sim" placeholder="Cuéntanos tu vinculación musical o tu historia con la banda..."></textarea>
            </div>

            <div class="input-group">
                <label>Marcha Favorita</label>
                <input type="text" id="perf-marcha" class="input-sim" placeholder="Ej: Pasa la Virgen Macarena">
            </div>

            <section class="seccion-preferencias">
                <h4>Tus intereses musicales</h4>
                <p>Se utilizarán para ordenar la sección «Para ti» de Comunidad.</p>
                <div class="preferencias-grid">
                    <label class="opcion-preferencia"><input type="checkbox" name="intereses-musicales" value="clasico"> Repertorio clásico</label>
                    <label class="opcion-preferencia"><input type="checkbox" name="intereses-musicales" value="contemporaneo"> Obras contemporáneas</label>
                    <label class="opcion-preferencia"><input type="checkbox" name="intereses-musicales" value="cornetas"> Con cornetas</label>
                    <label class="opcion-preferencia"><input type="checkbox" name="intereses-musicales" value="sin_cornetas"> Sin cornetas</label>
                    <label class="opcion-preferencia"><input type="checkbox" name="intereses-musicales" value="variedad"> Variedad de autores</label>
                </div>
            </section>

            <section class="seccion-preferencias">
                <h4>Actividad que quieres recibir</h4>
                <p>Solo aparecerán avisos relacionados con tus propias propuestas.</p>
                <div class="preferencias-grid">
                    <label class="opcion-preferencia"><input type="checkbox" id="perf-notif-comentarios" checked> Comentarios en mis propuestas</label>
                    <label class="opcion-preferencia"><input type="checkbox" id="perf-notif-valoraciones" checked> Apoyos a mis propuestas</label>
                </div>
            </section>
            
            <button onclick="guardarPerfil()" class="btn-accion">Guardar Cambios</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/pwa.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/perfil.js"></script>
</body>
</html>
