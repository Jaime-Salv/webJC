[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["web-push"]
  included_files = ["node_modules/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/templates/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/banda-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# La cámara solo se permite en el portal donde se escanea el fichaje.
[[headers]]
  for = "/templates/musicos.html"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/templates/musicos"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[redirects]]
  from = "/admin"
  to = "/templates/admin.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/templates/login.html"
  status = 200

[[redirects]]
  from = "/perfil"
  to = "/templates/perfil.html"
  status = 200

[[redirects]]
  from = "/catalogo"
  to = "/templates/catalogo.html"
  status = 200

[[redirects]]
  from = "/comunidad"
  to = "/templates/comunidad.html"
  status = 200

[[redirects]]
  from = "/simulacion"
  to = "/templates/simulacion.html"
  status = 200

[[redirects]]
  from = "/bigdata"
  to = "/templates/bigdata.html"
  status = 200

[[redirects]]
  from = "/analisis-general"
  to = "/templates/analisis_general.html"
  status = 200

# Function sources are not part of the public website.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
