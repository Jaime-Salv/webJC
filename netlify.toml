[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/templates/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/admin"
  to = "/templates/admin.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/templates/login.html"
  status = 200

[[redirects]]
  from = "/perfil"
  to = "/templates/perfil.html"
  status = 200

[[redirects]]
  from = "/catalogo"
  to = "/templates/catalogo.html"
  status = 200

[[redirects]]
  from = "/comunidad"
  to = "/templates/comunidad.html"
  status = 200

[[redirects]]
  from = "/simulacion"
  to = "/templates/simulacion.html"
  status = 200

[[redirects]]
  from = "/bigdata"
  to = "/templates/bigdata.html"
  status = 200

[[redirects]]
  from = "/analisis-general"
  to = "/templates/analisis_general.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
